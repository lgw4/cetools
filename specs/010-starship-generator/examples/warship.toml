# Warship "Ironclad" -- an 800-ton turret-armed cruiser: titanium steel
# armor, a hardened computer, and two double turrets.
#
# Hand-worked SRD reference figures (SC-002):
#   jump_rating = 1, maneuver_rating = 1, power_rating = 1
#   jump_fuel = 80.0 (assumed_jump_distance = 1), power_fuel = 8.0
#   tonnage_used = 264.0, cargo_tons = 536.0
#   hull_points = 16, structure_points = 16
#   hardpoints = 8, hardpoints_used = 2
#   crew: pilot=1 navigator=1 engineers=2 gunners=2 screen_operators=0
#         medic=0 stewards=0 (total=6)
#   total_cost = 183.825 MCr (10% standard-design discount applied)
#   build_weeks = 92

name = "Ironclad"
hull_tons = 800
standard_design = true
electronics = "advanced"

[drives]
jump = "D"
maneuver = "D"
power = "D"

[computer]
model = 4
hardened = true
software = [
  { name = "fire_control", level = 2 },
  { name = "evade", level = 1 },
]

[quarters]
staterooms = 6

[[armor]]
type = "titanium_steel"
percent = 10

[[fittings]]
kind = "armory"

[[turrets]]
mount = "double"
weapons = ["pulse_laser", "pulse_laser"]

[[turrets]]
mount = "double"
weapons = ["particle_beam", "sandcaster"]
