# Scout/Courier "Swift Wind" -- a 100-ton streamlined scout, Jump-Control
# software substitutes for a dedicated navigator, one sandcaster turret.
#
# Hand-worked SRD reference figures (SC-002):
#   jump_rating = 2, maneuver_rating = 2, power_rating = 2
#   jump_fuel = 20.0 (assumed_jump_distance = 2), power_fuel = 2.0
#   tonnage_used = 62.0, cargo_tons = 38.0
#   hull_points = 2, structure_points = 2
#   hardpoints = 1, hardpoints_used = 1
#   crew: pilot=1 navigator=0 engineers=1 gunners=1 screen_operators=0
#         medic=0 stewards=0 (total=3)
#   total_cost = 28.06 MCr (no standard-design discount)
#   build_weeks = 36

name = "Swift Wind"
hull_tons = 100
configuration = "streamlined"
electronics = "basic_civilian"

[drives]
jump = "A"
maneuver = "A"
power = "A"

[computer]
model = 2
software = [
  { name = "jump_control", level = 2 },
]

[quarters]
staterooms = 3

[[fittings]]
kind = "fuel_scoops"

[[turrets]]
mount = "single"
weapons = ["sandcaster"]
