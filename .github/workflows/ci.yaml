name: CI

# A branch with an open pull request matched both triggers, so every push ran
# the six-job matrix twice and reported twelve checks. `main` still gets a run
# per push, which is what protects the merge result itself.
#
# Only changes that can alter what the tests run against trigger a run: code,
# the packaged rules data under `src/`, and the golden files under `tests/`.
# Documentation is deliberately excluded, even the Markdown the documented-
# version guard reads. No check is required on `main`, so a skipped run leaves
# nothing pending.
on:
  push:
    branches: [main]
    paths: &test-inputs
      - "**.py"
      - "src/**"
      - "tests/**"
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yaml
  pull_request:
    paths: *test-inputs

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Exact tag, not @v10: astral-sh stopped publishing floating major tags
      # after v7, so @v10 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest
