#
# Mustering-out benefit item names referenced by the shipped career data.
# Exactly the eight items research.md R5 enumerates: every distinct item the
# twenty-four material-benefit tables award. `Armor`, `Personal Vehicle`, and
# `Trade Goods` are removed — no source career awards them.
#
# `Ship Share` is the singular the "Material Benefits" prose uses (FR-015a);
# a table row's `1D6 Ship Shares` becomes the quantified notation `1d6 Ship
# Share` against this entry, never a second plural entry.

schema = "benefits"
schema-version = 1

benefits = [
  "Low Passage", "Mid Passage", "High Passage", "Weapon",
  "Explorers' Society", "Ship Share", "Courier Vessel", "Research Vessel",
]
