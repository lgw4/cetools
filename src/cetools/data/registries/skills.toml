# Open Game Content per OGL 1.0a; see LICENSE-OGL.txt
#
# Skills referenced by the shipped chargen data. Each entry declares its
# permitted specialties explicitly, empty when it has none.
#
# Exactly the seventy names research.md R4 enumerates: the sixty-eight the
# source's skill chapter defines, plus two it does not (see below). A
# specialty may itself be an entry with specialties of its own — `Vehicle`
# names `Aircraft` and `Watercraft`, each a cascade in its own right — and
# resolving the outer skill continues through it (FR-012, schema v2).
#
# `Perception` and `Prospecting` are granted by career tables (Bureaucrat and
# Belter respectively) and defined nowhere in the source's skill chapter
# (FR-016). `Jack-of-All-Trades` is written in that canonical form; the
# chapter's own heading also gives `Jack o' Trades` as its sanctioned short
# form, which no career file writes but which a reader may encounter in the
# source (FR-017a).

schema = "skills"
schema-version = 2

