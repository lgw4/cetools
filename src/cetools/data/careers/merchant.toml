#
# The eighth career, completing the professional medical tier (research R6).
# A civilian rank ladder, proving rank titles are not a military-only shape.
# Reconciled against the source (research.md R7): the throws, every skill
# table, the rank ladder's titles and its one bonus grant (corrected from
# the source's misprinted "Pilot" to "Piloting", FR-017, D9), and both
# mustering-out tables all differ from the earlier transcription. Phase 7
# verification (verification/merchant.md) found the personal table's row 4
# wrongly repeated "Melee Combat" (from row 5); the source prints "Zero-G".

schema = "career"
schema-version = 4

name = "Merchant"
medical-tier = "professional"

[throws.qualification]
characteristic = "INT"
target = 4
dice = "2d6"

[throws.survival]
characteristic = "INT"
target = 5
dice = "2d6"

[throws.commission]
characteristic = "INT"
target = 5
dice = "2d6"

[throws.promotion]
characteristic = "EDU"
target = 8
dice = "2d6"

[throws.re-enlistment]
target = 4
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "Zero-G", "Melee Combat", "Steward"]

[tables.service]
entries = ["Comms", "Engineering", "Gun Combat", "Melee Combat", "Broker", "Vehicle"]

[tables.specialist]
entries = ["Carousing", "Gunnery", "Jack-of-All-Trades", "Medicine", "Navigation", "Piloting"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Engineering", "Medicine", "Navigation", "Sciences", "Tactics"]

[[ladders]]
name = "crew"
role = "entry"
ranks = [
  { rank = 0, title = "Crewman", bonus = "Steward 1" },
]

[[ladders]]
name = "officer"
role = "commissioned"
ranks = [
  { rank = 1, title = "Deck Cadet" },
  { rank = 2, title = "Fourth Officer" },
  { rank = 3, title = "Third Officer", bonus = "Piloting 1" },
  { rank = 4, title = "Second Officer" },
  { rank = 5, title = "First Officer" },
  { rank = 6, title = "Captain" },
]

[mustering-out]
cash = [1000, 5000, 10000, 20000, 20000, 50000, 100000]
benefits = ["Low Passage", "EDU +1", "Weapon", "High Passage", "1d6 Ship Share", "High Passage", "Explorers' Society"]
