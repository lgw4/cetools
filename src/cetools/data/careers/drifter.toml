#
# The always-available fallback (FR-006) and the one re-enterable career
# (FR-015). Neither commission nor promotion. Rank zero grants no bonus at
# all, and no title, matching the source printing nothing at all for every
# rank row. Reconciled against the source (research.md R7): the
# qualification target, the advanced-education gate, the cash table, the
# material table's real row count, and every skill table all differ from
# the earlier transcription.

schema = "career"
schema-version = 4

name = "Drifter"
medical-tier = "fringe"
always-available = true
re-enterable = true

[throws.qualification]
characteristic = "DEX"
target = 5
dice = "2d6"

[throws.survival]
characteristic = "END"
target = 5
dice = "2d6"

[throws.re-enlistment]
target = 5
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "Melee Combat", "Bribery", "Gambling"]

[tables.service]
entries = ["Streetwise", "Mechanics", "Gun Combat", "Melee Combat", "Recon", "Vehicle"]

[tables.specialist]
entries = ["Electronics", "Melee Combat", "Bribery", "Streetwise", "Gambling", "Recon"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Computer", "Engineering", "Jack-of-All-Trades", "Medicine", "Liaison", "Tactics"]

[[ladders]]
name = "drifter"
role = "entry"
ranks = [
  { rank = 0 },
]

[mustering-out]
cash = [0, 1000, 2000, 5000, 5000, 10000, 10000]
benefits = ["Low Passage", "INT +1", "Weapon", "Weapon", "Mid Passage", "Mid Passage"]
