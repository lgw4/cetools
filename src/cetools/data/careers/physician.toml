# New career (research.md R1). Ranks 4 and 6 carry the source's own
# abbreviated titles ("Attending Phys.", "Hospital Admin.") verbatim
# (D9) — not a transcription shorthand.

schema = "career"
schema-version = 4

name = "Physician"
medical-tier = "professional"

[throws.qualification]
characteristic = "EDU"
target = 6
dice = "2d6"

[throws.survival]
characteristic = "INT"
target = 4
dice = "2d6"

[throws.commission]
characteristic = "INT"
target = 5
dice = "2d6"

[throws.promotion]
characteristic = "EDU"
target = 8
dice = "2d6"

[throws.re-enlistment]
target = 5
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "INT +1", "EDU +1", "Gun Combat"]

[tables.service]
entries = ["Admin", "Computer", "Mechanics", "Medicine", "Leadership", "Sciences"]

[tables.specialist]
entries = ["Computer", "Carousing", "Electronics", "Medicine", "Medicine", "Sciences"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Computer", "Jack-of-All-Trades", "Linguistics", "Medicine", "Sciences"]

[[ladders]]
name = "junior"
role = "entry"
ranks = [
  { rank = 0, title = "Intern", bonus = "Medicine 1" },
]

[[ladders]]
name = "officer"
role = "commissioned"
ranks = [
  { rank = 1, title = "Resident" },
  { rank = 2, title = "Senior Resident" },
  { rank = 3, title = "Chief Resident" },
  { rank = 4, title = "Attending Phys.", bonus = "Admin 1" },
  { rank = 5, title = "Service Chief" },
  { rank = 6, title = "Hospital Admin." },
]

[mustering-out]
cash = [2000, 10000, 20000, 20000, 50000, 100000, 100000]
benefits = ["Low Passage", "EDU +1", "INT +1", "High Passage", "Explorers' Society", "High Passage", "SOC +1"]
