# Open Game Content per OGL 1.0a; see LICENSE-OGL.txt
#
# The reference career, transcribed from the source material rather than
# from the illustrative values in contracts/data-files.md. It exercises
# every element of the career schema: a commission, a second rank ladder,
# a bonus on a rank of each ladder, and a characteristic-gated table
# (FR-018).

schema = "career"
schema-version = 1

name = "Navy"

[throws.qualification]
characteristic = "INT"
target = 6

[throws.survival]
characteristic = "INT"
target = 5

[throws.commission]
characteristic = "SOC"
target = 7

[throws.promotion]
characteristic = "EDU"
target = 6

[throws.re-enlistment]
target = 5

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "INT +1", "EDU +1", "Melee Combat"]

[tables.service]
entries = ["Comms", "Engineering", "Gun Combat", "Gunnery", "Melee Combat", "Vehicle"]

[tables.specialist]
entries = ["Gravitics", "Jack-of-All-Trades", "Melee Combat", "Navigation", "Leadership", "Piloting"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Computer", "Engineering", "Medicine", "Navigation", "Tactics"]

# A character is enlisted at rank 0 and joins the officer ladder on a
# successful commission, which is why the two ladders do not overlap.
[[ladders]]
name = "enlisted"
ranks = [
  { rank = 0, title = "Starman", bonus = "Zero-G 1" },
]

# The newly commissioned officer's blade grant is the one place the source
# names a specialty rather than leaving the choice to the character, so it is
# written fully specified. Every other skill here is bare, which is the
# source's own way of saying a choice is owed.
[[ladders]]
name = "officer"
ranks = [
  { rank = 1, title = "Midshipman", bonus = "Melee Combat (Slashing Weapons) 1" },
  { rank = 2, title = "Lieutenant" },
  { rank = 3, title = "Lt Commander", bonus = "Tactics 1" },
  { rank = 4, title = "Commander" },
  { rank = 5, title = "Captain" },
  { rank = 6, title = "Commodore" },
]

[mustering-out]
cash = [1000, 5000, 10000, 10000, 20000, 50000, 50000]
benefits = ["Low Passage", "EDU +1", "Weapon", "Mid Passage", "SOC +1", "High Passage", "Explorers' Society"]
