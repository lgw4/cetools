#
# The reference career: it exercises a commission, a second rank ladder, a
# rank bonus, and a characteristic-gated table (002-rules-data-loading
# FR-018). A source-first re-read (verification/navy.md, 004 T095) found
# the source prints a single rank column, 0-6, not the two overlapping
# columns this file previously carried: an earlier feature (T155) had
# added rank 5 ("Petty Officer") to the enlisted ladder and specified a
# specialty ("Melee Combat (Slashing Weapons)") on the officer ladder's
# Midshipman grant, neither of which the source prints, to exercise engine
# paths no shipped career otherwise reaches. FR-024 admits no deviation
# ground for either — the source is neither internally inconsistent nor
# silent here, it simply says something else — so both are corrected out.
# As a consequence, no shipped career's uncommissioned rank exceeds 0 and
# no shipped rank bonus specifies a specialty; both stay covered by unit
# fixtures rather than by shipped content — the specialty-on-a-rank-bonus
# guard is tests/integration/test_reference_career.py::
# test_no_shipped_career_specifies_a_specialty_on_a_rank_bonus.

schema = "career"
schema-version = 4

name = "Navy"
medical-tier = "service"

[throws.qualification]
characteristic = "INT"
target = 6
dice = "2d6"

[throws.survival]
characteristic = "INT"
target = 5
dice = "2d6"

[throws.commission]
characteristic = "SOC"
target = 7
dice = "2d6"

[throws.promotion]
characteristic = "EDU"
target = 6
dice = "2d6"

[throws.re-enlistment]
target = 5
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "INT +1", "EDU +1", "Melee Combat"]

[tables.service]
entries = ["Comms", "Engineering", "Gun Combat", "Gunnery", "Melee Combat", "Vehicle"]

[tables.specialist]
entries = ["Gravitics", "Jack-of-All-Trades", "Melee Combat", "Navigation", "Leadership", "Piloting"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Computer", "Engineering", "Medicine", "Navigation", "Tactics"]

# A character is enlisted at rank 0 and joins the officer ladder on a
# successful commission, matching the split every other two-ladder career
# in the package uses (Merchant, Scout, and the rest): the entry ladder
# carries only rank 0, and the source's single printed rank column becomes
# the officer ladder's ranks 1-6.
[[ladders]]
name = "enlisted"
role = "entry"
ranks = [
  { rank = 0, title = "Starman", bonus = "Zero-G 1" },
]

[[ladders]]
name = "officer"
role = "commissioned"
ranks = [
  { rank = 1, title = "Midshipman" },
  { rank = 2, title = "Lieutenant" },
  { rank = 3, title = "Lt Commander", bonus = "Tactics 1" },
  { rank = 4, title = "Commander" },
  { rank = 5, title = "Captain" },
  { rank = 6, title = "Commodore" },
]

[mustering-out]
cash = [1000, 5000, 10000, 10000, 20000, 50000, 50000]
benefits = ["Low Passage", "EDU +1", "Weapon", "Mid Passage", "SOC +1", "High Passage", "Explorers' Society"]
