# New career (research.md R1).

schema = "career"
schema-version = 4

name = "Scientist"
medical-tier = "professional"

[throws.qualification]
characteristic = "EDU"
target = 6
dice = "2d6"

[throws.survival]
characteristic = "EDU"
target = 5
dice = "2d6"

[throws.commission]
characteristic = "INT"
target = 7
dice = "2d6"

[throws.promotion]
characteristic = "INT"
target = 6
dice = "2d6"

[throws.re-enlistment]
target = 5
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "INT +1", "EDU +1", "Gun Combat"]

[tables.service]
entries = ["Admin", "Computer", "Electronics", "Medicine", "Bribery", "Sciences"]

[tables.specialist]
entries = ["Navigation", "Admin", "Sciences", "Sciences", "Animals", "Vehicle"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Computer", "Jack-of-All-Trades", "Linguistics", "Medicine", "Sciences"]

[[ladders]]
name = "junior"
role = "entry"
ranks = [
  { rank = 0, title = "Instructor", bonus = "Sciences 1" },
]

[[ladders]]
name = "officer"
role = "commissioned"
ranks = [
  { rank = 1, title = "Adjunct Professor" },
  { rank = 2, title = "Research Professor" },
  { rank = 3, title = "Assistant Professor", bonus = "Computer 1" },
  { rank = 4, title = "Associate Professor" },
  { rank = 5, title = "Professor" },
  { rank = 6, title = "Distinguished Professor" },
]

[mustering-out]
cash = [1000, 5000, 10000, 10000, 20000, 50000, 50000]
benefits = ["Low Passage", "EDU +1", "INT +1", "Mid Passage", "SOC +1", "High Passage", "Research Vessel"]
