#
# New career (research.md R1). No commission or advancement; two skill
# rolls a term instead of one (FR-009). Rank 0 grants a bonus with no
# title. Material row 5 is a rolled quantity (FR-011).

schema = "career"
schema-version = 4

name = "Hunter"
medical-tier = "professional"

[throws.qualification]
characteristic = "END"
target = 5
dice = "2d6"

[throws.survival]
characteristic = "STR"
target = 8
dice = "2d6"

[throws.re-enlistment]
target = 6
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "INT +1", "Athletics", "Gun Combat"]

[tables.service]
entries = ["Mechanics", "Gun Combat", "Melee Combat", "Recon", "Survival", "Vehicle"]

[tables.specialist]
entries = ["Admin", "Comms", "Electronics", "Recon", "Animals", "Vehicle"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Linguistics", "Medicine", "Liaison", "Tactics", "Animals"]

[[ladders]]
name = "hunter"
role = "entry"
ranks = [
  { rank = 0, bonus = "Survival 1" },
]

[mustering-out]
cash = [1000, 5000, 10000, 20000, 20000, 50000, 100000]
benefits = ["Low Passage", "INT +1", "Weapon", "High Passage", "1d6 Ship Share", "High Passage"]
