#
# Draft row 5. Neither commission nor promotion: FR-009's two skill rolls a
# term follow from the absence of both throws rather than from a flag. The
# single ladder names no distinct rank title, matching the source; its rank
# 0 grant is corrected from the source's misprinted "Pilot" to "Piloting"
# (FR-017, D9). Reconciled against the source (research.md R7): the
# qualification and re-enlistment targets, the material table's real row
# count, and the service skills all differ from the earlier transcription.

schema = "career"
schema-version = 4

name = "Scout"
medical-tier = "service"

[throws.qualification]
characteristic = "INT"
target = 6
dice = "2d6"

[throws.survival]
characteristic = "END"
target = 7
dice = "2d6"

[throws.re-enlistment]
target = 6
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "Jack-of-All-Trades", "EDU +1", "Melee Combat"]

[tables.service]
entries = ["Comms", "Electronics", "Gun Combat", "Gunnery", "Recon", "Piloting"]

[tables.specialist]
entries = ["Engineering", "Gunnery", "Demolitions", "Navigation", "Medicine", "Vehicle"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Computer", "Linguistics", "Medicine", "Navigation", "Tactics"]

[[ladders]]
name = "scout"
role = "entry"
ranks = [
  { rank = 0, bonus = "Piloting 1" },
]

[mustering-out]
cash = [1000, 5000, 10000, 10000, 20000, 50000, 50000]
benefits = ["Low Passage", "EDU +1", "Weapon", "Mid Passage", "Explorers' Society", "Courier Vessel"]
