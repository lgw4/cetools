schema = "career"
schema-version = 4

name = "Surface System Defense"
medical-tier = "service"

[throws.qualification]
characteristic = "END"
target = 5
dice = "2d6"

[throws.survival]
characteristic = "EDU"
target = 5
dice = "2d6"

[throws.commission]
characteristic = "END"
target = 6
dice = "2d6"

[throws.promotion]
characteristic = "EDU"
target = 7
dice = "2d6"

[throws.re-enlistment]
target = 5
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "Athletics", "Melee Combat", "Vehicle"]

[tables.service]
entries = ["Mechanics", "Gun Combat", "Gunnery", "Melee Combat", "Recon", "Battle Dress"]

[tables.specialist]
entries = ["Comms", "Demolitions", "Gun Combat", "Melee Combat", "Survival", "Vehicle"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Computer", "Jack-of-All-Trades", "Medicine", "Leadership", "Tactics"]

[[ladders]]
name = "enlisted"
role = "entry"
ranks = [
  { rank = 0, title = "Private", bonus = "Gun Combat 1" },
]

[[ladders]]
name = "officer"
role = "commissioned"
ranks = [
  { rank = 1, title = "Lieutenant" },
  { rank = 2, title = "Captain" },
  { rank = 3, title = "Major", bonus = "Leadership 1" },
  { rank = 4, title = "Lt Colonel" },
  { rank = 5, title = "Colonel" },
  { rank = 6, title = "General" },
]

[mustering-out]
cash = [1000, 5000, 10000, 10000, 20000, 50000, 50000]
benefits = ["Low Passage", "INT +1", "Weapon", "Mid Passage", "Weapon", "High Passage", "SOC +1"]
