#
# Draft row 3. Reconciled against the source (research.md R7): the throws,
# every skill table, the rank ladder's titles and bonus grant, and both
# mustering-out tables all differ from the earlier transcription; it grants
# `Watercraft` directly, which v2 resolves as a nested cascade.

schema = "career"
schema-version = 4

name = "Maritime System Defense"
medical-tier = "service"

[throws.qualification]
characteristic = "END"
target = 5
dice = "2d6"

[throws.survival]
characteristic = "END"
target = 5
dice = "2d6"

[throws.commission]
characteristic = "INT"
target = 6
dice = "2d6"

[throws.promotion]
characteristic = "EDU"
target = 7
dice = "2d6"

[throws.re-enlistment]
target = 5
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "Athletics", "Melee Combat", "Vehicle"]

[tables.service]
entries = ["Mechanics", "Gun Combat", "Gunnery", "Melee Combat", "Survival", "Watercraft"]

[tables.specialist]
entries = ["Comms", "Electronics", "Gun Combat", "Demolitions", "Recon", "Watercraft"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Computer", "Jack-of-All-Trades", "Medicine", "Leadership", "Tactics"]

[[ladders]]
name = "enlisted"
role = "entry"
ranks = [
  { rank = 0, title = "Seaman", bonus = "Watercraft 1" },
]

[[ladders]]
name = "officer"
role = "commissioned"
ranks = [
  { rank = 1, title = "Ensign" },
  { rank = 2, title = "Lieutenant" },
  { rank = 3, title = "Lt Commander", bonus = "Leadership 1" },
  { rank = 4, title = "Commander" },
  { rank = 5, title = "Captain" },
  { rank = 6, title = "Admiral" },
]

[mustering-out]
cash = [1000, 5000, 10000, 10000, 20000, 50000, 50000]
benefits = ["Low Passage", "EDU +1", "Weapon", "Mid Passage", "Weapon", "High Passage", "SOC +1"]
