# Open Game Content per OGL 1.0a; see LICENSE-OGL.txt
#
# New career (research.md R1). Rank 3's title is corrected from the
# source's misprinted "Liaision" to "Liaison" (FR-017, D9). Phase 7
# verification (verification/colonist.md) found the advanced-education
# table's row 2 was mistranscribed as "Computer"; the source prints
# "Linguistics".

schema = "career"
schema-version = 4

name = "Colonist"
medical-tier = "fringe"

[throws.qualification]
characteristic = "END"
target = 5
dice = "2d6"

[throws.survival]
characteristic = "END"
target = 6
dice = "2d6"

[throws.commission]
characteristic = "INT"
target = 7
dice = "2d6"

[throws.promotion]
characteristic = "EDU"
target = 6
dice = "2d6"

[throws.re-enlistment]
target = 5
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "INT +1", "Athletics", "Gun Combat"]

[tables.service]
entries = ["Mechanics", "Gun Combat", "Animals", "Electronics", "Survival", "Vehicle"]

[tables.specialist]
entries = ["Athletics", "Carousing", "Jack-of-All-Trades", "Engineering", "Animals", "Vehicle"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Linguistics", "Medicine", "Liaison", "Admin", "Animals"]

[[ladders]]
name = "junior"
role = "entry"
ranks = [
  { rank = 0, title = "Citizen", bonus = "Survival 1" },
]

[[ladders]]
name = "officer"
role = "commissioned"
ranks = [
  { rank = 1, title = "District Leader" },
  { rank = 2, title = "District Delegate" },
  { rank = 3, title = "Council Advisor", bonus = "Liaison 1" },
  { rank = 4, title = "Councilor" },
  { rank = 5, title = "Lieutenant Governor" },
  { rank = 6, title = "Governor" },
]

[mustering-out]
cash = [1000, 5000, 5000, 5000, 10000, 20000, 50000]
benefits = ["Low Passage", "INT +1", "Weapon", "Mid Passage", "Mid Passage", "High Passage", "SOC +1"]
