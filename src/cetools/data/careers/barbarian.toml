#
# New career (research.md R1). No commission or advancement; two skill
# rolls a term instead of one (FR-009). Rank 0 grants a bonus with no
# title. Cash row 1 is a real zero, not a placeholder (FR-010).

schema = "career"
schema-version = 4

name = "Barbarian"
medical-tier = "fringe"

[throws.qualification]
characteristic = "END"
target = 5
dice = "2d6"

[throws.survival]
characteristic = "STR"
target = 6
dice = "2d6"

[throws.re-enlistment]
target = 5
dice = "2d6"

[tables.personal]
entries = ["STR +1", "DEX +1", "END +1", "INT +1", "Athletics", "Gun Combat"]

[tables.service]
entries = ["Gun Combat", "Gun Combat", "Melee Combat", "Recon", "Survival", "Animals"]

[tables.specialist]
entries = ["Gun Combat", "Jack-of-All-Trades", "Melee Combat", "Recon", "Animals", "Tactics"]

[tables.advanced-education]
requires = "EDU 8+"
entries = ["Advocate", "Linguistics", "Medicine", "Leadership", "Broker", "Tactics"]

[[ladders]]
name = "barbarian"
role = "entry"
ranks = [
  { rank = 0, bonus = "Melee Combat 1" },
]

[mustering-out]
cash = [0, 1000, 2000, 5000, 5000, 10000, 10000]
benefits = ["Low Passage", "INT +1", "Weapon", "Mid Passage", "END +1", "Mid Passage"]
