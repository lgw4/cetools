target = 5
dice = "2d6"

[throws.survival]
characteristic = "DEX"
target = 4
dice = "2d6"

[throws.commission]
characteristic = "STR"
target = 6
dice = "2d6"

[throws.promotion]
characteristic = "INT"
target = 7
dice = "2d6"

[throws.re-enlistment]
