  { rank = 1, title = "Associate" },
  { rank = 2, title = "Soldier", bonus = "Gun Combat 1" },
  { rank = 3, title = "Lieutenant" },
  { rank = 4, title = "Underboss" },
  { rank = 5, title = "Consigliere" },
  { rank = 6, title = "Boss" },
]

[mustering-out]
cash = [1000, 5000, 5000, 5000, 10000, 20000, 50000]
