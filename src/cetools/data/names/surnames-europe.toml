#
# Deliberately the largest of the seven shipped surname tables: the shipped
# tables differ in size by enough that weighting taken over names rather
# than over regions would put at least one region's expected share outside
# SC-019's band (research, tests/unit/test_names.py).

schema = "surnames"
schema-version = 1

region = "Europe"
source = "Compiled from Wikipedia's \"List of most common surnames in European countries\" (https://en.wikipedia.org/wiki/List_of_most_common_surnames_in_European_countries) and \"List of the most common surnames in Germany\" (https://en.wikipedia.org/wiki/List_of_the_most_common_surnames_in_Germany), CC BY-SA 4.0, which compile national census/registry and demographic-survey data: England (UCL paediatric-epidemiology surname study), Ireland (Irish surname genealogical/etymological sources), Italy (Mappa dei Cognomi and Forebears.io), Germany (Forebears.io and the Digitales Familiennamenwörterbuch Deutschlands), France (L'Internaute), Poland (Polish Ministry of Interior 2009 surname statistics), Sweden (Statistics Sweden/SCB), Norway (Statistics Norway/SSB), and Denmark (Statistics Denmark/DST)."

