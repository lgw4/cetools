# Beowulf -- the free trader of tests/data/ships/free-trader.toml,
# carrying the two design fields this feature adds.
#
# Exercises:
#   purpose     -> completes the description's first sentence
#   tech_level  -> overrides the derived value in the heading. The derived
#                  value is 8 (Model 1 computer TL7, Standard sensors TL8); 11 is
#                  higher and is used as given, never re-checked.
#
# Every computed figure matches free-trader.toml exactly:
#   tonnage_used = 65.0, cargo_tons = 135.0, crew total = 5,
#   total_cost = 29.772 MCr, build_weeks = 44

name = "Beowulf"
purpose = "a subsidized merchant plying the routes an interstellar polity's mail contracts do not reach"
hull_tons = 200
tech_level = 11
standard_design = true

[drives]
jump = "A"
maneuver = "A"
power = "A"

[computer]
model = 1

[quarters]
staterooms = 4

[[fittings]]
kind = "fuel_processor"

[passengers]
middle = 2
