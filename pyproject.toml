[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cetools"
version = "2026.08.1"
description = "Dice and task check engine for SRD-derived 2D6 roleplaying rules"
readme = "README.md"
requires-python = ">=3.13"
# The source code's licence, as an SPDX expression, so the built metadata says
# what governs the package rather than only shipping the texts. `license-files`
# alone left PyPI and `pip show` reporting cetools as unlicensed. The Open Game
# Content under `src/cetools/data/` is covered by LICENSE-OGL.txt and its
# Section 15 chain, which no SPDX expression can carry.
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSE-OGL.txt"]
dependencies = [
    "typer",
]

[project.scripts]
cetools = "cetools.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "black",
    "isort",
    "flake8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cetools"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cetools",
    "tests",
    "LICENSE",
    "LICENSE-OGL.txt",
    "README.md",
    "CHANGELOG.md",
]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"

# Configuration for the rumdl markdown linter, which is deliberately neither a
# dependency nor a CI gate; see the Style and tooling section of
# CONTRIBUTING.md for why it is optional and how to run it.
[tool.rumdl]
flavor = "gfm"
disable = ["MD013"]
# Vendored Spec Kit tooling; its markdown is not ours to fix.
exclude = [".claude", ".specify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
