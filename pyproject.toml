[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cetools"
version = "2026.08.1"
description = "Dice and task check engine for SRD-derived 2D6 roleplaying rules"
readme = "README.md"
requires-python = ">=3.13"
license-files = ["LICENSE", "LICENSE-OGL.txt"]
dependencies = [
    "typer",
]

[project.scripts]
cetools = "cetools.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "black",
    "isort",
    "flake8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cetools"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cetools",
    "tests",
    "LICENSE",
    "LICENSE-OGL.txt",
    "README.md",
    "CHANGELOG.md",
]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"

[tool.rumdl]
flavor = "gfm"
disable = ["MD013"]
# Vendored Spec Kit tooling; its markdown is not ours to fix.
exclude = [".claude", ".specify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
