[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cetools"
version = "2026.08.1"
description = "Dice and task check engine for SRD-derived 2D6 roleplaying rules"
readme = "README.md"
requires-python = ">=3.13"
# The source code's licence, as an SPDX expression, so the built metadata says
# what governs the package rather than only shipping the texts. `license-files`
# alone left PyPI and `pip show` reporting cetools as unlicensed. The Open Game
# Content under `src/cetools/data/` is covered by LICENSE-OGL.txt and its
# Section 15 chain, which no SPDX expression can carry.
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSE-OGL.txt"]
dependencies = [
    "typer",
]
keywords = [
    "dice",
    "rpg",
    "tabletop",
    "2d6",
    "srd",
    "task-resolution",
    "character-generation",
    "seeded",
    "reproducible",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Typing :: Typed",
]
authors = [{ name = "Chip Warden" }]

[project.urls]
Homepage = "https://github.com/lgw4/cetools"
Repository = "https://github.com/lgw4/cetools"
Changelog = "https://github.com/lgw4/cetools/blob/main/CHANGELOG.md"
Issues = "https://github.com/lgw4/cetools/issues"

[project.scripts]
cetools = "cetools.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "black",
    "isort",
    "flake8",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cetools"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cetools",
    "tests",
    "LICENSE",
    "LICENSE-OGL.txt",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"

# mypy is an optional tool; see the Style and tooling section of
# CONTRIBUTING.md. It gates nothing: not the suite, not CI, not a release.
[tool.mypy]
python_version = "3.13"

# Configuration for the rumdl markdown linter, which is deliberately neither a
# dependency nor a CI gate; see the Style and tooling section of
# CONTRIBUTING.md for why it is optional and how to run it.
[tool.rumdl]
flavor = "gfm"
disable = ["MD013"]
# Vendored Spec Kit tooling; its markdown is not ours to fix.
# .github/release-footer.md: a fragment appended after the changelog body in
# a release's notes, not a standalone document — MD041 (first-line heading)
# does not apply, and adding one would put an unwanted heading on every
# published release page.
exclude = [".claude", ".specify", ".github/release-footer.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `uv run pytest` does not put the repository root on sys.path the way
# `python -m pytest` does, and `tests/guards/test_packaging.py` and
# `tests/unit/test_licensing.py` import `tests.conftest` as a package. Without
# this, those two modules fail to collect under the exact command CI and
# CONTRIBUTING.md run (T142).
pythonpath = ["."]
# Platform requirements, applied in tests/conftest.py. Registered here so an
# unmet one skips rather than warning about an unknown mark.
markers = [
    "needs_posix_special_files: builds a FIFO or points at a device node",
    "needs_enforced_chmod: needs chmod(0o000) to actually deny access",
    "slow: exercises a large sampled population; excluded from the inner loop",
]
